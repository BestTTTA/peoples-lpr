# Runs on the spark server next to FaceFinder, sharing its Postgres and MinIO
# (own database and bucket). Deploy with ./docker/deploy.sh.
#
# The port is bound to loopback: the public route is the Cloudflare tunnel
# (host network) pointing at http://localhost:${APP_PORT}.
services:
  web:
    image: ${DOCKER_IMAGE:-peoples-lpr:latest}
    container_name: peoples-lpr
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${APP_PORT:-3300}:3000"
    env_file:
      - .env
    environment:
      # In-network addresses win over .env, which may describe a laptop + tunnel.
      DATABASE_URL: postgresql://${PG_USER:-peoples_lpr}:${PG_PASSWORD:?}@postgres:5432/${PG_DB:-peoples_lpr}
      S3_ENDPOINT: http://minio:9000
      CROP_API_URL: http://plate-crop:8000
    # Model uploads pass through in memory (up to 95 MB).
    mem_limit: 768m
    networks:
      - facefinder

  # Plate detector for auto-crop (crop-service/). Internal only: the web app
  # calls it over the network; it has no published port.
  plate-crop:
    build: ./crop-service
    image: peoples-lpr-crop:latest
    container_name: peoples-lpr-crop
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      OMP_NUM_THREADS: "4"
      # Shared with the web app (from .env); enables model upload/switching.
      ADMIN_TOKEN: ${CROP_ADMIN_TOKEN:-}
    volumes:
      - crop-data:/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - facefinder

volumes:
  crop-data:

networks:
  facefinder:
    name: repo_default
    external: true
